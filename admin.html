<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理面板 - Portfolio</title>
  <style>
    :root {
      --admin-bg: #f5f4f1;
      --admin-surface: #fff;
      --admin-text: #1a1a18;
      --admin-text-secondary: #787870;
      --admin-border: #e8e6e0;
      --admin-accent: #5b726c;
      --admin-danger: #c44;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--admin-bg);
      color: var(--admin-text);
      line-height: 1.6;
    }

    /* 顶部栏 */
    .topbar {
      background: var(--admin-surface);
      border-bottom: 1px solid var(--admin-border);
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--admin-border);
      background: var(--admin-surface);
      color: var(--admin-text);
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn:hover {
      border-color: #ccc;
    }

    .btn-primary {
      background: var(--admin-text);
      color: #fff;
      border-color: var(--admin-text);
    }

    .btn-primary:hover {
      background: #333;
    }

    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-danger { color: var(--admin-danger); border-color: #ecc; }
    .btn-danger:hover { background: #fff5f5; border-color: var(--admin-danger); }

    .status {
      font-size: 12px;
      color: var(--admin-text-secondary);
      margin-right: 8px;
      transition: opacity 0.3s;
    }

    .status.saved { color: #4a8; }
    .status.error { color: var(--admin-danger); }

    /* 主体布局 */
    .layout {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    /* 侧边栏 */
    .sidebar {
      width: 200px;
      background: var(--admin-surface);
      border-right: 1px solid var(--admin-border);
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
    }

    .sidebar-nav button {
      text-align: left;
      padding: 10px 28px;
      border: none;
      background: none;
      font-size: 14px;
      color: var(--admin-text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      border-left: 2px solid transparent;
    }

    .sidebar-nav button:hover {
      color: var(--admin-text);
      background: #fafaf8;
    }

    .sidebar-nav button.active {
      color: var(--admin-text);
      font-weight: 500;
      border-left-color: var(--admin-text);
      background: #fafaf8;
    }

    /* 内容区 */
    .content {
      flex: 1;
      padding: 32px 40px;
      max-width: 760px;
      overflow-y: auto;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .panel-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .panel-desc {
      font-size: 14px;
      color: var(--admin-text-secondary);
      margin-bottom: 28px;
    }

    /* 表单 */
    .field {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--admin-text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .field-input,
    .field-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      color: var(--admin-text);
      background: var(--admin-surface);
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    .field-input:focus,
    .field-textarea:focus {
      outline: none;
      border-color: #aaa;
    }

    .field-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .field-hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    /* 颜色选择器 */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .color-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.08);
      cursor: pointer;
      flex-shrink: 0;
    }

    .color-info {
      flex: 1;
      min-width: 0;
    }

    .color-name {
      font-size: 12px;
      color: var(--admin-text-secondary);
      margin-bottom: 2px;
    }

    .color-input {
      width: 100%;
      border: none;
      font-size: 13px;
      font-family: monospace;
      color: var(--admin-text);
      background: none;
      padding: 0;
    }

    .color-input:focus { outline: none; }

    /* 作品/经历列表 */
    .list-item {
      background: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
      position: relative;
    }

    .list-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .list-item-index {
      font-size: 13px;
      font-weight: 600;
      color: var(--admin-text-muted, #aaa);
    }

    .list-item-actions {
      display: flex;
      gap: 6px;
    }

    .list-item-fields {
      display: grid;
      gap: 12px;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      border: 1.5px dashed var(--admin-border);
      border-radius: var(--radius);
      background: none;
      font-size: 14px;
      color: var(--admin-text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .add-btn:hover {
      border-color: #aaa;
      color: var(--admin-text);
    }

    /* 行内字段 */
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .tags-input-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
      background: var(--admin-surface);
      min-height: 40px;
      align-items: center;
    }

    .tags-input-wrap:focus-within {
      border-color: #aaa;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: #f0eeea;
      border-radius: 4px;
      font-size: 12px;
      color: var(--admin-text);
    }

    .tag-chip button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      color: #999;
      padding: 0;
    }

    .tag-chip button:hover { color: var(--admin-danger); }

    .tag-input-inline {
      border: none;
      outline: none;
      font-size: 13px;
      font-family: inherit;
      min-width: 80px;
      flex: 1;
      background: transparent;
    }

    /* 提示 */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--admin-text);
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.3s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--admin-border);
        padding: 0;
        overflow-x: auto;
      }
      .sidebar-nav {
        flex-direction: row;
        padding: 0 8px;
      }
      .sidebar-nav button {
        padding: 12px 14px;
        font-size: 13px;
        white-space: nowrap;
        border-left: none;
        border-bottom: 2px solid transparent;
      }
      .sidebar-nav button.active {
        border-left-color: transparent;
        border-bottom-color: var(--admin-text);
      }
      .content { padding: 24px 20px; }
      .color-grid { grid-template-columns: repeat(2, 1fr); }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="topbar-title">Portfolio 管理面板</span>
    <div class="topbar-actions">
      <span class="status" id="status"></span>
      <button class="btn" onclick="window.open('/', '_blank')">预览网站</button>
      <button class="btn btn-primary" onclick="saveConfig()">保存更改</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <button class="active" data-panel="theme">配色主题</button>
        <button data-panel="nav">导航设置</button>
        <button data-panel="hero">Hero 区</button>
        <button data-panel="works">作品展示</button>
        <button data-panel="about">关于页面</button>
        <button data-panel="contact">联系方式</button>
        <button data-panel="site">站点设置</button>
      </nav>
    </aside>

    <div class="content" id="content"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let config = {};

    // 加载配置
    async function loadConfig() {
      try {
        const res = await fetch("/api/config");
        config = await res.json();
        renderAll();
      } catch (err) {
        showToast("无法加载配置，请确认服务器已启动", "error");
      }
    }

    // 保存配置
    async function saveConfig() {
      try {
        // 先从表单收集数据
        collectFormData();
        const res = await fetch("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config),
        });
        const data = await res.json();
        if (data.ok) {
          showToast("已保存", "saved");
        } else {
          showToast("保存失败: " + data.error, "error");
        }
      } catch (err) {
        showToast("保存失败: " + err.message, "error");
      }
    }

    function showToast(msg, type) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show " + (type || "");
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    // 当前活跃的面板
    let activePanel = "theme";

    function renderAll() {
      // 侧边栏点击
      document.querySelectorAll(".sidebar-nav button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".sidebar-nav button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activePanel = btn.dataset.panel;
          renderPanel();
        });
      });

      renderPanel();
    }

    function renderPanel() {
      const content = document.getElementById("content");
      switch (activePanel) {
        case "theme":
          content.innerHTML = renderThemePanel();
          break;
        case "nav":
          content.innerHTML = renderNavPanel();
          break;
        case "hero":
          content.innerHTML = renderHeroPanel();
          break;
        case "works":
          content.innerHTML = renderWorksPanel();
          break;
        case "about":
          content.innerHTML = renderAboutPanel();
          break;
        case "contact":
          content.innerHTML = renderContactPanel();
          break;
        case "site":
          content.innerHTML = renderSitePanel();
          break;
      }
      bindPanelEvents();
    }

    // =============== 配色主题面板 ===============
    function renderThemePanel() {
      const theme = config.theme || {};
      const labels = {
        bg: "页面背景",
        surface: "卡片背景",
        text: "主文字色",
        textSecondary: "次要文字",
        textMuted: "辅助文字",
        border: "边框色",
        borderLight: "浅边框",
        accent: "强调色",
        accentSoft: "浅强调色",
      };

      let colors = "";
      for (const [key, val] of Object.entries(labels)) {
        const hex = theme[key] || "#000";
        colors += `
          <div class="color-item">
            <input type="color" class="color-swatch" value="${hex}" data-key="${key}" title="${val}">
            <div class="color-info">
              <div class="color-name">${val}</div>
              <input class="color-input" type="text" value="${hex}" data-key="${key}" maxlength="7">
            </div>
          </div>`;
      }

      return `
        <div class="panel active">
          <h2 class="panel-title">配色主题</h2>
          <p class="panel-desc">修改配色后点击右上角「保存更改」，刷新网站即可看到效果。</p>
          <div class="color-grid">${colors}</div>
        </div>`;
    }

    // =============== 导航面板 ===============
    function renderNavPanel() {
      const nav = config.nav || {};
      const logo = esc(nav.logo || "");
      let links = "";
      (nav.links || []).forEach((link, i) => {
        links += `
          <div class="list-item">
            <div class="list-item-header">
              <span class="list-item-index">链接 ${i + 1}</span>
              <div class="list-item-actions">
                <button class="btn btn-sm" onclick="moveItem('nav','links',${i},-1)">↑</button>
                <button class="btn btn-sm" onclick="moveItem('nav','links',${i},1)">↓</button>
                <button class="btn btn-sm btn-danger" onclick="removeItem('nav','links',${i})">删除</button>
              </div>
            </div>
            <div class="list-item-fields">
              <div class="field-row">
                <div class="field">
                  <label class="field-label">显示文字</label>
                  <input class="field-input nav-link-label" type="text" value="${esc(link.label)}" data-index="${i}">
                </div>
                <div class="field">
                  <label class="field-label">链接目标</label>
                  <input class="field-input nav-link-href" type="text" value="${esc(link.href)}" data-index="${i}">
                </div>
              </div>
            </div>
          </div>`;
      });

      return `
        <div class="panel active">
          <h2 class="panel-title">导航设置</h2>
          <p class="panel-desc">修改顶部导航栏的 Logo 和链接。</p>
          <div class="field">
            <label class="field-label">Logo 文字</label>
            <input class="field-input" id="nav-logo" type="text" value="${logo}" maxlength="8">
          </div>
          <div class="field">
            <label class="field-label">导航链接</label>
            ${links}
          </div>
          <button class="add-btn" onclick="addNavLink()">+ 添加链接</button>
        </div>`;
    }

    // =============== Hero 面板 ===============
    function renderHeroPanel() {
      const hero = config.hero || {};
      return `
        <div class="panel active">
          <h2 class="panel-title">Hero 区域</h2>
          <p class="panel-desc">首页第一屏的标题和介绍语。</p>
          <div class="field">
            <label class="field-label">问候语</label>
            <input class="field-input" id="hero-greeting" type="text" value="${esc(hero.greeting || "")}">
          </div>
          <div class="field">
            <label class="field-label">名字</label>
            <input class="field-input" id="hero-name" type="text" value="${esc(hero.name || "")}">
          </div>
          <div class="field">
            <label class="field-label">副标题（一句话介绍）</label>
            <input class="field-input" id="hero-tagline" type="text" value="${esc(hero.tagline || "")}">
          </div>
          <div class="field">
            <label class="field-label">详细介绍</label>
            <textarea class="field-textarea" id="hero-desc" rows="3">${esc(hero.description || "")}</textarea>
            <span class="field-hint">支持 HTML，可使用 &lt;span class="text-accent"&gt;文字&lt;/span&gt; 添加强调色</span>
          </div>
        </div>`;
    }

    // =============== 作品面板 ===============
    function renderWorksPanel() {
      const works = config.works || {};
      const tag = esc(works.tag || "");
      const title = esc(works.title || "");

      let items = "";
      (works.items || []).forEach((item, i) => {
        const tagsStr = (item.tags || []).join(", ");
        items += `
          <div class="list-item">
            <div class="list-item-header">
              <span class="list-item-index">项目 ${i + 1}</span>
              <div class="list-item-actions">
                <button class="btn btn-sm" onclick="moveItem('works','items',${i},-1)">↑</button>
                <button class="btn btn-sm" onclick="moveItem('works','items',${i},1)">↓</button>
                <button class="btn btn-sm btn-danger" onclick="removeItem('works','items',${i})">删除</button>
              </div>
            </div>
            <div class="list-item-fields">
              <div class="field">
                <label class="field-label">标签（逗号分隔）</label>
                <input class="field-input work-tags" type="text" value="${esc(tagsStr)}" data-index="${i}">
              </div>
              <div class="field">
                <label class="field-label">项目名称</label>
                <input class="field-input work-title" type="text" value="${esc(item.title || "")}" data-index="${i}">
              </div>
              <div class="field">
                <label class="field-label">项目描述</label>
                <textarea class="field-textarea work-desc" data-index="${i}" rows="2">${esc(item.description || "")}</textarea>
              </div>
              <div class="field">
                <label class="field-label">图片路径（可选，留空显示占位图）</label>
                <input class="field-input work-image" type="text" value="${esc(item.image || "")}" data-index="${i}" placeholder="如：images/my-project.jpg">
              </div>
            </div>
          </div>`;
      });

      return `
        <div class="panel active">
          <h2 class="panel-title">作品展示</h2>
          <p class="panel-desc">管理作品集区域的内容。</p>
          <div class="field-row">
            <div class="field">
              <label class="field-label">区块标签</label>
              <input class="field-input" id="works-tag" type="text" value="${tag}">
            </div>
            <div class="field">
              <label class="field-label">区块标题</label>
              <input class="field-input" id="works-title" type="text" value="${title}">
            </div>
          </div>
          <div class="field"><label class="field-label">作品列表</label>${items}</div>
          <button class="add-btn" onclick="addWorkItem()">+ 添加作品</button>
        </div>`;
    }

    // =============== 关于面板 ===============
    function renderAboutPanel() {
      const about = config.about || {};
      const tag = esc(about.tag || "");
      const title = esc(about.title || "");

      const skillsStr = (about.skills || []).join(", ");

      let exp = "";
      (about.experience || []).forEach((item, i) => {
        exp += `
          <div class="list-item">
            <div class="list-item-header">
              <span class="list-item-index">经历 ${i + 1}</span>
              <div class="list-item-actions">
                <button class="btn btn-sm" onclick="moveItem('about','experience',${i},-1)">↑</button>
                <button class="btn btn-sm" onclick="moveItem('about','experience',${i},1)">↓</button>
                <button class="btn btn-sm btn-danger" onclick="removeItem('about','experience',${i})">删除</button>
              </div>
            </div>
            <div class="list-item-fields">
              <div class="field">
                <label class="field-label">时间</label>
                <input class="field-input exp-date" type="text" value="${esc(item.date || "")}" data-index="${i}">
              </div>
              <div class="field">
                <label class="field-label">标题</label>
                <input class="field-input exp-title" type="text" value="${esc(item.title || "")}" data-index="${i}">
              </div>
              <div class="field">
                <label class="field-label">描述</label>
                <input class="field-input exp-desc" type="text" value="${esc(item.description || "")}" data-index="${i}">
              </div>
            </div>
          </div>`;
      });

      return `
        <div class="panel active">
          <h2 class="panel-title">关于页面</h2>
          <p class="panel-desc">管理技能标签和经历时间线。</p>
          <div class="field-row">
            <div class="field"><label class="field-label">区块标签</label><input class="field-input" id="about-tag" type="text" value="${tag}"></div>
            <div class="field"><label class="field-label">区块标题</label><input class="field-input" id="about-title" type="text" value="${title}"></div>
          </div>
          <div class="field">
            <label class="field-label">技能标签（逗号分隔）</label>
            <input class="field-input" id="about-skills" type="text" value="${esc(skillsStr)}">
          </div>
          <div class="field"><label class="field-label">经历</label>${exp}</div>
          <button class="add-btn" onclick="addExperience()">+ 添加经历</button>
        </div>`;
    }

    // =============== 联系面板 ===============
    function renderContactPanel() {
      const contact = config.contact || {};
      const tag = esc(contact.tag || "");
      const title = esc(contact.title || "");
      const text = esc(contact.text || "");

      let links = "";
      (contact.links || []).forEach((link, i) => {
        links += `
          <div class="list-item">
            <div class="list-item-header">
              <span class="list-item-index">链接 ${i + 1}</span>
              <div class="list-item-actions">
                <button class="btn btn-sm" onclick="moveItem('contact','links',${i},-1)">↑</button>
                <button class="btn btn-sm" onclick="moveItem('contact','links',${i},1)">↓</button>
                <button class="btn btn-sm btn-danger" onclick="removeItem('contact','links',${i})">删除</button>
              </div>
            </div>
            <div class="list-item-fields">
              <div class="field-row">
                <div class="field"><label class="field-label">显示文字</label><input class="field-input contact-label" type="text" value="${esc(link.label || "")}" data-index="${i}"></div>
                <div class="field"><label class="field-label">图标 (email/github)</label><input class="field-input contact-icon" type="text" value="${esc(link.icon || "")}" data-index="${i}"></div>
              </div>
              <div class="field"><label class="field-label">链接</label><input class="field-input contact-href" type="text" value="${esc(link.href || "")}" data-index="${i}"></div>
            </div>
          </div>`;
      });

      return `
        <div class="panel active">
          <h2 class="panel-title">联系方式</h2>
          <p class="panel-desc">管理联系区域的内容和链接。</p>
          <div class="field-row">
            <div class="field"><label class="field-label">区块标签</label><input class="field-input" id="contact-tag" type="text" value="${tag}"></div>
            <div class="field"><label class="field-label">区块标题</label><input class="field-input" id="contact-title" type="text" value="${title}"></div>
          </div>
          <div class="field">
            <label class="field-label">介绍文字</label>
            <textarea class="field-textarea" id="contact-text" rows="2">${text}</textarea>
          </div>
          <div class="field"><label class="field-label">联系链接</label>${links}</div>
          <button class="add-btn" onclick="addContactLink()">+ 添加链接</button>
        </div>`;
    }

    // =============== 站点设置 ===============
    function renderSitePanel() {
      const site = config.site || {};
      return `
        <div class="panel active">
          <h2 class="panel-title">站点设置</h2>
          <p class="panel-desc">站点标题、描述和 Footer 文字。</p>
          <div class="field">
            <label class="field-label">站点标题（浏览器标签）</label>
            <input class="field-input" id="site-title" type="text" value="${esc(site.title || "")}">
          </div>
          <div class="field">
            <label class="field-label">SEO 描述</label>
            <input class="field-input" id="site-desc" type="text" value="${esc(site.description || "")}">
          </div>
          <div class="field">
            <label class="field-label">Footer 文字</label>
            <input class="field-input" id="site-footer" type="text" value="${esc(site.footer || "")}">
          </div>
        </div>`;
    }

    // =============== 事件绑定 ===============
    function bindPanelEvents() {
      // 配色：颜色选择器 ↔ 文本输入同步
      document.querySelectorAll(".color-swatch").forEach((swatch) => {
        swatch.addEventListener("input", (e) => {
          const key = e.target.dataset.key;
          const val = e.target.value;
          config.theme[key] = val;
          const textInput = document.querySelector(`.color-input[data-key="${key}"]`);
          if (textInput) textInput.value = val;
        });
      });

      document.querySelectorAll(".color-input").forEach((input) => {
        input.addEventListener("input", (e) => {
          const key = e.target.dataset.key;
          const val = e.target.value;
          if (/^#[0-9a-fA-F]{0,6}$/.test(val)) {
            config.theme[key] = val;
            const swatch = document.querySelector(`.color-swatch[data-key="${key}"]`);
            if (swatch && val.length === 7) swatch.value = val;
          }
        });
      });
    }

    // =============== 数据收集 ===============
    function collectFormData() {
      switch (activePanel) {
        case "theme":
          // 已通过事件实时同步到 config.theme
          break;
        case "nav":
          config.nav.logo = document.getElementById("nav-logo")?.value || "";
          document.querySelectorAll(".nav-link-label").forEach((el) => {
            config.nav.links[parseInt(el.dataset.index)].label = el.value;
          });
          document.querySelectorAll(".nav-link-href").forEach((el) => {
            config.nav.links[parseInt(el.dataset.index)].href = el.value;
          });
          break;
        case "hero":
          config.hero.greeting = document.getElementById("hero-greeting")?.value || "";
          config.hero.name = document.getElementById("hero-name")?.value || "";
          config.hero.tagline = document.getElementById("hero-tagline")?.value || "";
          config.hero.description = document.getElementById("hero-desc")?.value || "";
          break;
        case "works":
          config.works.tag = document.getElementById("works-tag")?.value || "";
          config.works.title = document.getElementById("works-title")?.value || "";
          document.querySelectorAll(".work-tags").forEach((el) => {
            const i = parseInt(el.dataset.index);
            config.works.items[i].tags = el.value.split(",").map((s) => s.trim()).filter(Boolean);
          });
          document.querySelectorAll(".work-title").forEach((el) => {
            config.works.items[parseInt(el.dataset.index)].title = el.value;
          });
          document.querySelectorAll(".work-desc").forEach((el) => {
            config.works.items[parseInt(el.dataset.index)].description = el.value;
          });
          document.querySelectorAll(".work-image").forEach((el) => {
            config.works.items[parseInt(el.dataset.index)].image = el.value;
          });
          break;
        case "about":
          config.about.tag = document.getElementById("about-tag")?.value || "";
          config.about.title = document.getElementById("about-title")?.value || "";
          config.about.skills = (document.getElementById("about-skills")?.value || "")
            .split(",").map((s) => s.trim()).filter(Boolean);
          document.querySelectorAll(".exp-date").forEach((el) => {
            config.about.experience[parseInt(el.dataset.index)].date = el.value;
          });
          document.querySelectorAll(".exp-title").forEach((el) => {
            config.about.experience[parseInt(el.dataset.index)].title = el.value;
          });
          document.querySelectorAll(".exp-desc").forEach((el) => {
            config.about.experience[parseInt(el.dataset.index)].description = el.value;
          });
          break;
        case "contact":
          config.contact.tag = document.getElementById("contact-tag")?.value || "";
          config.contact.title = document.getElementById("contact-title")?.value || "";
          config.contact.text = document.getElementById("contact-text")?.value || "";
          document.querySelectorAll(".contact-label").forEach((el) => {
            config.contact.links[parseInt(el.dataset.index)].label = el.value;
          });
          document.querySelectorAll(".contact-icon").forEach((el) => {
            config.contact.links[parseInt(el.dataset.index)].icon = el.value;
          });
          document.querySelectorAll(".contact-href").forEach((el) => {
            config.contact.links[parseInt(el.dataset.index)].href = el.value;
          });
          break;
        case "site":
          config.site.title = document.getElementById("site-title")?.value || "";
          config.site.description = document.getElementById("site-desc")?.value || "";
          config.site.footer = document.getElementById("site-footer")?.value || "";
          break;
      }
    }

    // =============== 列表操作 ===============
    function addNavLink() {
      config.nav.links.push({ label: "新链接", href: "#" });
      renderPanel();
    }

    function addWorkItem() {
      config.works.items.push({ tags: ["标签"], title: "新项目", description: "项目描述", image: "" });
      renderPanel();
    }

    function addExperience() {
      config.about.experience.push({ date: "202X", title: "新经历", description: "描述" });
      renderPanel();
    }

    function addContactLink() {
      config.contact.links.push({ label: "新链接", href: "#", icon: "email" });
      renderPanel();
    }

    function removeItem(section, key, index) {
      config[section][key].splice(index, 1);
      renderPanel();
    }

    function moveItem(section, key, index, dir) {
      const arr = config[section][key];
      const newIdx = index + dir;
      if (newIdx < 0 || newIdx >= arr.length) return;
      [arr[index], arr[newIdx]] = [arr[newIdx], arr[index]];
      renderPanel();
    }

    // =============== 初始化 ===============
    function esc(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // 页面切换前收集当前面板数据
    const origRenderPanel = renderPanel;
    renderPanel = function () {
      if (activePanel && config.theme) collectFormData();
      origRenderPanel();
    };

    loadConfig();

    // 快捷键 Ctrl+S 保存
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        saveConfig();
      }
    });
  </script>
</body>
</html>
