<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理面板 - Portfolio</title>
  <style>
    :root {
      --admin-bg: #f5f4f1;
      --admin-surface: #fff;
      --admin-text: #1a1a18;
      --admin-text-secondary: #787870;
      --admin-border: #e8e6e0;
      --admin-accent: #5b726c;
      --admin-danger: #c44;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--admin-bg);
      color: var(--admin-text);
      line-height: 1.6;
    }

    /* 顶部栏 */
    .topbar {
      background: var(--admin-surface);
      border-bottom: 1px solid var(--admin-border);
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--admin-border);
      background: var(--admin-surface);
      color: var(--admin-text);
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn:hover {
      border-color: #ccc;
    }

    .btn-primary {
      background: var(--admin-text);
      color: #fff;
      border-color: var(--admin-text);
    }

    .btn-primary:hover {
      background: #333;
    }

    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-danger { color: var(--admin-danger); border-color: #ecc; }
    .btn-danger:hover { background: #fff5f5; border-color: var(--admin-danger); }

    .status {
      font-size: 12px;
      color: var(--admin-text-secondary);
      margin-right: 8px;
      transition: opacity 0.3s;
    }

    .status.saved { color: #4a8; }
    .status.error { color: var(--admin-danger); }

    /* 主体布局 */
    .layout {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    /* 侧边栏 */
    .sidebar {
      width: 200px;
      background: var(--admin-surface);
      border-right: 1px solid var(--admin-border);
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
    }

    .sidebar-nav button {
      text-align: left;
      padding: 10px 28px;
      border: none;
      background: none;
      font-size: 14px;
      color: var(--admin-text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      border-left: 2px solid transparent;
    }

    .sidebar-nav button:hover {
      color: var(--admin-text);
      background: #fafaf8;
    }

    .sidebar-nav button.active {
      color: var(--admin-text);
      font-weight: 500;
      border-left-color: var(--admin-text);
      background: #fafaf8;
    }

    /* 内容区 */
    .content {
      flex: 1;
      padding: 32px 40px;
      max-width: 760px;
      overflow-y: auto;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .panel-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .panel-desc {
      font-size: 14px;
      color: var(--admin-text-secondary);
      margin-bottom: 28px;
    }

    /* 表单 */
    .field {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--admin-text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .field-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ccc;
      margin-right: 4px;
      vertical-align: middle;
      transition: background 0.2s;
    }

    .field-dot.customized {
      background: #5b8;
      box-shadow: 0 0 4px rgba(85, 187, 136, 0.4);
    }

    .field-reset {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      color: #bbb;
      margin-left: 6px;
      padding: 0 4px;
      transition: color 0.2s;
      font-family: inherit;
    }

    .field-reset:hover {
      color: var(--admin-danger);
    }

    .field-input,
    .field-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      color: var(--admin-text);
      background: var(--admin-surface);
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    .field-input:focus,
    .field-textarea:focus {
      outline: none;
      border-color: #aaa;
    }

    .field-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .field-hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    /* 颜色选择器 */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .color-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.08);
      cursor: pointer;
      flex-shrink: 0;
    }

    .color-info {
      flex: 1;
      min-width: 0;
    }

    .color-name {
      font-size: 12px;
      color: var(--admin-text-secondary);
      margin-bottom: 2px;
    }

    .color-input {
      width: 100%;
      border: none;
      font-size: 13px;
      font-family: monospace;
      color: var(--admin-text);
      background: none;
      padding: 0;
    }

    .color-input:focus { outline: none; }

    /* 作品/经历列表 */
    .list-item {
      background: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
      position: relative;
    }

    .list-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .list-item-index {
      font-size: 13px;
      font-weight: 600;
      color: var(--admin-text-muted, #aaa);
    }

    .list-item-actions {
      display: flex;
      gap: 6px;
    }

    .list-item-fields {
      display: grid;
      gap: 12px;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      border: 1.5px dashed var(--admin-border);
      border-radius: var(--radius);
      background: none;
      font-size: 14px;
      color: var(--admin-text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .add-btn:hover {
      border-color: #aaa;
      color: var(--admin-text);
    }

    /* 行内字段 */
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .tags-input-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
      background: var(--admin-surface);
      min-height: 40px;
      align-items: center;
    }

    .tags-input-wrap:focus-within {
      border-color: #aaa;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: #f0eeea;
      border-radius: 4px;
      font-size: 12px;
      color: var(--admin-text);
    }

    .tag-chip button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      color: #999;
      padding: 0;
    }

    .tag-chip button:hover { color: var(--admin-danger); }

    .tag-input-inline {
      border: none;
      outline: none;
      font-size: 13px;
      font-family: inherit;
      min-width: 80px;
      flex: 1;
      background: transparent;
    }

    /* 提示 */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--admin-text);
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.3s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 实时预览卡片 */
    .hero-preview {
      background: #fafaf8;
      border: 1px solid var(--admin-border);
      border-radius: var(--radius);
      padding: 40px 32px;
      text-align: center;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-preview-inner {
      max-width: 480px;
    }

    .hero-preview-title {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #1a1a18;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .hero-preview-name {
      font-weight: 600;
    }

    .hero-preview-sub {
      font-size: 16px;
      color: #787870;
      margin-bottom: 20px;
    }

    .hero-preview-desc {
      font-size: 14px;
      color: #b0b0a8;
      line-height: 1.7;
    }

    .hero-preview-desc .text-accent {
      color: #8b8578;
      font-weight: 500;
    }

    /* 上传区域 */
    .upload-zone {
      border: 2px dashed var(--admin-border);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafaf8;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--admin-accent);
      background: #f0f4f2;
    }

    .upload-icon {
      color: var(--admin-text-muted, #aaa);
      margin-bottom: 8px;
    }

    .upload-text {
      font-size: 14px;
      color: var(--admin-text-secondary);
      margin-bottom: 4px;
    }

    .upload-hint {
      font-size: 12px;
      color: #bbb;
    }

    .upload-progress {
      margin-top: 12px;
      height: 4px;
      background: var(--admin-border);
      border-radius: 2px;
      overflow: hidden;
    }

    .upload-progress-bar {
      height: 100%;
      background: var(--admin-accent);
      width: 0%;
      transition: width 0.3s;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--admin-border);
        padding: 0;
        overflow-x: auto;
      }
      .sidebar-nav {
        flex-direction: row;
        padding: 0 8px;
      }
      .sidebar-nav button {
        padding: 12px 14px;
        font-size: 13px;
        white-space: nowrap;
        border-left: none;
        border-bottom: 2px solid transparent;
      }
      .sidebar-nav button.active {
        border-left-color: transparent;
        border-bottom-color: var(--admin-text);
      }
      .content { padding: 24px 20px; }
      .color-grid { grid-template-columns: repeat(2, 1fr); }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <span class="topbar-title">Portfolio 管理面板</span>
    <div class="topbar-actions">
      <span class="status" id="status"></span>
      <button class="btn" onclick="toggleAdminLang()" id="lang-toggle-btn" style="font-weight:600;">中</button>
      <button class="btn" onclick="revertConfig()">撤回修改</button>
      <button class="btn" onclick="previewSite()">预览网站</button>
      <button class="btn btn-primary" onclick="saveConfig()">保存更改</button>
      <button class="btn btn-primary" onclick="deploySite()" style="background:#5b726c;border-color:#5b726c;">部署上线</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <button class="active" data-panel="theme">配色主题</button>
        <button data-panel="nav">导航设置</button>
        <button data-panel="hero">Hero 区</button>
        <button data-panel="works">作品展示</button>
        <button data-panel="about">关于页面</button>
        <button data-panel="contact">联系方式</button>
        <button data-panel="site">站点设置</button>
      </nav>
    </aside>

    <div class="content" id="content"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let config = {};
    let defaults = {};
    let adminLang = "zh"; // 管理面板当前编辑的语言

    // 双语辅助：返回当前语言对应的 key
    function lk(baseKey) {
      return adminLang === "en" ? baseKey + "_en" : baseKey;
    }

    // 获取嵌套对象的值（用于数组项等非顶层字段）
    function lov(obj, baseKey) {
      const key = adminLang === "en" ? baseKey + "_en" : baseKey;
      return (obj && obj[key]) ? obj[key] : "";
    }

    // 获取顶层字段的合并值（config 覆盖 defaults）
    // 用法：lv("hero", "greeting") 或 lv(heroObj, "greeting")
    function lv(section, baseKey, fallback) {
      const key = adminLang === "en" ? baseKey + "_en" : baseKey;
      // 字符串 → 读取 config[section] / defaults[section]
      if (typeof section === "string") {
        if (config[section] && config[section][key] !== undefined && config[section][key] !== "") return config[section][key];
        if (defaults[section] && defaults[section][key] !== undefined) return defaults[section][key];
        return fallback || "";
      }
      // 对象 → 直接从对象读取，回退
      if (section && section[key] !== undefined && section[key] !== "") return section[key];
      return fallback || "";
    }

    // 获取值来源：返回 'config' | 'defaults'
    function valSource(obj, baseKey) {
      const key = adminLang === "en" ? baseKey + "_en" : baseKey;
      if (config[obj] && config[obj][key] !== undefined && config[obj][key] !== "") return "config";
      return "defaults";
    }

    // 生成字段标签：带状态圆点
    function fieldLabel(text, obj, baseKey) {
      const src = valSource(obj, baseKey);
      const dot = src === "config"
        ? '<span class="field-dot customized" title="已自定义"></span>'
        : '<span class="field-dot" title="使用默认值"></span>';
      return `<label class="field-label">${dot} ${text}</label>`;
    }

    // 重置单个字段为默认值
    function resetField(obj, baseKey) {
      const keys = [baseKey, baseKey + "_en"];
      keys.forEach(k => {
        if (config[obj]) config[obj][k] = "";
      });
      renderPanel();
      showToast("已重置为默认值", "saved");
    }

    // 切换编辑语言
    function toggleAdminLang() {
      collectFormData(); // 先保存当前输入
      adminLang = adminLang === "zh" ? "en" : "zh";
      const btn = document.getElementById("lang-toggle-btn");
      if (btn) btn.textContent = adminLang === "zh" ? "中" : "EN";
      renderPanel(); // 用新语言重新渲染
    }

    // 加载配置
    async function loadConfig() {
      try {
        const [resDef, resCfg] = await Promise.all([
          fetch("/api/defaults"),
          fetch("/api/config"),
        ]);
        defaults = await resDef.json();
        config = await resCfg.json();
        renderAll();
      } catch (err) {
        showToast("无法加载配置，请确认服务器已启动", "error");
      }
    }

    // 保存配置
    async function saveConfig() {
      try {
        // 先从表单收集数据
        collectFormData();
        const res = await fetch("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config),
        });
        const data = await res.json();
        if (data.ok) {
          showToast("已保存", "saved");
        } else {
          showToast("保存失败: " + data.error, "error");
        }
      } catch (err) {
        showToast("保存失败: " + err.message, "error");
      }
    }

    function showToast(msg, type) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.className = "toast show " + (type || "");
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    // 当前活跃的面板
    let activePanel = "theme";

    function renderAll() {
      // 侧边栏点击
      document.querySelectorAll(".sidebar-nav button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".sidebar-nav button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activePanel = btn.dataset.panel;
          renderPanel();
        });
      });

      renderPanel();
    }

    function renderPanel() {
      const content = document.getElementById("content");
      switch (activePanel) {
        case "theme":
          content.innerHTML = renderThemePanel();
          break;
        case "nav":
          content.innerHTML = renderNavPanel();
          break;
        case "hero":
          content.innerHTML = renderHeroPanel();
          break;
        case "works":
          content.innerHTML = renderWorksPanel();
          break;
        case "about":
          content.innerHTML = renderAboutPanel();
          break;
        case "contact":
          content.innerHTML = renderContactPanel();
          break;
        case "site":
          content.innerHTML = renderSitePanel();
          break;
      }
      bindPanelEvents();
    }

    // =============== 配色主题面板 ===============
    function renderThemePanel() {
      const theme = config.theme || {};
      const labels = {
        bg: "页面背景",
        surface: "卡片背景",
        text: "主文字色",
        textSecondary: "次要文字",
        textMuted: "辅助文字",
        border: "边框色",
        borderLight: "浅边框",
        accent: "强调色",
        accentSoft: "浅强调色",
      };

      let colors = "";
      for (const [key, val] of Object.entries(labels)) {
        const hex = theme[key] || "#000";
        colors += `
          <div class="color-item">
            <input type="color" class="color-swatch" value="${hex}" data-key="${key}" title="${val}">
            <div class="color-info">
              <div class="color-name">${val}</div>
              <input class="color-input" type="text" value="${hex}" data-key="${key}" maxlength="7">
            </div>
          </div>`;
      }

      return `
        <div class="panel active">
          <h2 class="panel-title">配色主题</h2>
          <p class="panel-desc">修改配色后点击右上角「保存更改」，刷新网站即可看到效果。</p>
          <div class="color-grid">${colors}</div>
        </div>`;
    }

    // =============== 导航面板 ===============
    function renderNavPanel() {
      const navLinks = (config.nav && config.nav.links && config.nav.links.length)
        ? config.nav.links
        : (defaults.nav ? defaults.nav.links : []);
      const logo = esc(lv('nav', 'logo') || "");
      let links = "";
      navLinks.forEach((link, i) => {
        links += `
          <div class="list-item">
            <div class="list-item-header">
              <span class="list-item-index">链接 ${i + 1}</span>
              <div class="list-item-actions">
                <button class="btn btn-sm" onclick="moveItem('nav','links',${i},-1)">↑</button>
                <button class="btn btn-sm" onclick="moveItem('nav','links',${i},1)">↓</button>
                <button class="btn btn-sm btn-danger" onclick="removeItem('nav','links',${i})">删除</button>
              </div>
            </div>
            <div class="list-item-fields">
              <div class="field-row">
                <div class="field">
                  <label class="field-label">显示文字</label>
                  <input class="field-input nav-link-label" type="text" value="${esc(lov(link, 'label'))}" data-index="${i}">
                </div>
                <div class="field">
                  <label class="field-label">链接目标</label>
                  <input class="field-input nav-link-href" type="text" value="${esc(link.href || '')}" data-index="${i}">
                </div>
              </div>
            </div>
          </div>`;
      });

      return `
        <div class="panel active">
          <h2 class="panel-title">导航设置 <span style="font-size:12px;color:var(--admin-accent);font-weight:400;">— 正在编辑：${adminLang === 'zh' ? '中文' : 'English'}</span></h2>
          <p class="panel-desc">修改顶部导航栏的 Logo 和链接。</p>
          <div class="field">
            ${fieldLabel('Logo 文字', 'nav', 'logo')}
            <input class="field-input" id="nav-logo" type="text" value="${logo}" maxlength="8" placeholder="${esc(defaults.nav.logo)}">
          </div>
          <div class="field">
            <label class="field-label">导航链接</label>
            ${links}
          </div>
          <button class="add-btn" onclick="addNavLink()">+ 添加链接</button>
        </div>`;
    }

    // =============== Hero 面板 ===============
    function renderHeroPanel() {
      const hero = config.hero || {};
      const videoEnabled = hero.videoEnabled ? "checked" : "";
      const defaults = {
        greeting: "你好，我是",
        name: "你的名字",
        tagline: "创造简洁、好用、有温度的数字体验。",
        description: "专注于<span class=\"text-accent\">产品设计</span>与<span class=\"text-accent\">前端开发</span>",
      };
      return `
        <div class="panel active">
          <h2 class="panel-title">Hero 区域 <span style="font-size:12px;color:var(--admin-accent);font-weight:400;">— 正在编辑：${adminLang === 'zh' ? '中文' : 'English'}</span></h2>

          const val = e.target.value;
          config.theme[key] = val;
          const textInput = document.querySelector(`.color-input[data-key="${key}"]`);
          if (textInput) textInput.value = val;

      });

      document.querySelectorAll(".color-input").forEach((input) => {

          const key = e.target.dataset.key;
          const val = e.target.value;
          if (/^#[0-9a-fA-F]{0,6}$/.test(val)) {
            config.theme[key] = val;
            const swatch = document.querySelector(`.color-swatch[data-key="${key}"]`);
            if (swatch && val.length === 7) swatch.value = val;
          }
        });
      });

    function esc(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")

    // =============== 视频上传 ===============
    function setupUpload() {
      const zone = document.getElementById("upload-zone");
      const input = document.getElementById("upload-input");
      const progress = document.getElementById("upload-progress");
      const bar = document.getElementById("upload-progress-bar");
      const videoPathInput = document.getElementById("hero-video");

      if (!zone || !input) return;

      zone.addEventListener("click", () => input.click());

      zone.addEventListener("dragover", (e) => {
        e.preventDefault();
        zone.classList.add("drag-over");
      });

      zone.addEventListener("dragleave", () => {
        zone.classList.remove("drag-over");
      });

      zone.addEventListener("drop", (e) => {
        e.preventDefault();
        zone.classList.remove("drag-over");
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
      });

      input.addEventListener("change", () => {
        const file = input.files[0];
        if (file) handleFile(file);
      });

      function handleFile(file) {
        if (!file.type.startsWith("video/")) {
          showToast("请选择视频文件", "error");
          return;
        }
        if (file.size > 100 * 1024 * 1024) {
          showToast("文件不能超过 100MB", "error");
          return;
        }

        progress.style.display = "block";
        bar.style.width = "0%";

        const formData = new FormData();
        formData.append("file", file);

        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            bar.style.width = Math.round((e.loaded / e.total) * 90) + "%";
          }
        };
        xhr.onload = () => {
          try {
            const result = JSON.parse(xhr.responseText);
            if (result.ok) {
              bar.style.width = "100%";
              if (videoPathInput) videoPathInput.value = result.path;
              config.hero.video = result.path;
              config.hero.videoEnabled = true;
              const checkbox = document.getElementById("hero-video-enabled");
              if (checkbox) checkbox.checked = true;
              setTimeout(() => {
                progress.style.display = "none";
                bar.style.width = "0%";
              }, 800);
              showToast("视频已上传", "saved");
            } else {
              showToast("上传失败: " + result.error, "error");
              progress.style.display = "none";
            }
          } catch (err) {
            showToast("上传失败: " + err.message, "error");
            progress.style.display = "none";
          }
        };
        xhr.onerror = () => {
          showToast("上传失败: 网络错误", "error");
          progress.style.display = "none";
        };
        xhr.open("POST", "/api/upload");
        xhr.send(formData);
      }
    }

    async function revertConfig() {
      if (!confirm("确定要撤回所有未保存的修改？将恢复到上次保存的状态。")) return;
      try {
        const res = await fetch("/api/config");
        config = await res.json();
        renderPanel();
        showToast("已恢复到上次保存的状态", "saved");
      } catch (err) {
        showToast("撤回失败: " + err.message, "error");
      }
    }

    // =============== 部署上线 ===============
    async function deploySite() {
      collectFormData();
      await saveConfig();
      showToast("正在构建并部署...");

      try {
        const res = await fetch("/api/deploy", { method: "POST" });
        const result = await res.json();
        if (result.ok) {
          showToast("已部署上线，稍后刷新线上网站即可看到", "saved");
        } else {
          showToast("部署失败: " + result.message, "error");
        }
      } catch (err) {
        showToast("部署失败: " + err.message, "error");
      }
    }

    // =============== 实时预览 ===============
    function updateHeroPreview() {
      const greeting = document.getElementById("hero-greeting")?.value || "你好，我是";
      const name = document.getElementById("hero-name")?.value || "你的名字";
      const tagline = document.getElementById("hero-tagline")?.value || "创造简洁、好用、有温度的数字体验。";
      const desc = document.getElementById("hero-desc")?.value ||
        '专注于<span class="text-accent">产品设计</span>与<span class="text-accent">前端开发</span>';

      const pvGreeting = document.getElementById("pv-greeting");
      const pvName = document.getElementById("pv-name");
      const pvTagline = document.getElementById("pv-tagline");
      const pvDesc = document.getElementById("pv-desc");

      if (pvGreeting) pvGreeting.textContent = greeting;
      if (pvName) pvName.textContent = name;
      if (pvTagline) pvTagline.textContent = tagline;
      if (pvDesc) pvDesc.innerHTML = desc;
    }

    // 快捷键 Ctrl+S 保存
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        saveConfig();
      }
    });
  </script>
</body>
</html>
